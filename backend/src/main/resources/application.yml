spring:
  application:
    name: tasks
  datasource:
    # Padrão: H2 em memória (zero configuração). Com Docker/Postgres, use as variáveis DB_*.
    url: ${DB_URL:jdbc:h2:mem:tasks;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-0123456789abcdef}
    expiration-minutes: 120
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
